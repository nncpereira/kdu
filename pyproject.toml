[tool.ruff]
required-version = ">=0.6.0"
line-length = 100
target-version = "py312"
extend-exclude = [
    "*/migrations/*.py",
    "htmlcov",
    ".venv",
    "frontend",
    "staticfiles",
]

[tool.ruff.lint]
# Core useful checks only.
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
]

ignore = [
    # Formatting — black handles this.
    "E501",   # line too long
    "E203",   # whitespace before ':' (black-compatible)
    "E731",   # lambda assignment

    # Django / DRF conventions ruff doesn't understand.
    "B008",   # function call in default argument (Depends(), etc.)
]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django; leave them alone.
"*/migrations/*.py" = ["E", "F", "I", "UP", "B"]

# __init__.py often re-exports things.
"__init__.py" = ["F401", "F403"]

# Settings modules use star imports.
"*/settings/*.py" = ["F403", "F405"]

# Test factories re-export via star imports.
"tests/factories/__init__.py" = ["F401", "F403"]

# Tests often need broad exception assertions and unused fixtures.
"tests/**" = ["B017", "F841"]
"*/tests/**" = ["B017", "F841"]
"**/test_*.py" = ["B017", "F841"]

# Conftest is fixture-heavy.
"conftest.py" = ["F401", "F811"]

# apps.py: imports inside ready() exist for their side effects
# (registering @register handlers and signal receivers).
# Never treat them as unused.
"*/apps.py" = ["F401"]