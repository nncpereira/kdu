[pytest]
DJANGO_SETTINGS_MODULE = kdu.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    ; --cov=.
    ; --cov-report=term-missing:skip-covered
    ; --cov-report=html:htmlcov
    ; --cov-report=xml:coverage.xml
    ; --cov-append
    ; --no-cov-on-fail
    -p no:warnings

markers =
    integration: full DB-level integration test (requires Postgres)
    smoke: quick sanity check that environment is ready
    slow: tests that take longer than 3 seconds
    pipeline: exercises the Maker-Checker-Certifier flow
    trigger: verifies database-level invariants (Postgres triggers)
    shu: SHU calculation, snapshot, aggregation, payout
    ledger: journal entry creation / certification / reversal

testpaths = tests