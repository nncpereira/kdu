<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — KDU</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 28rem;
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      text-align: center;
    }
    .card-header {
      background: #0369a1;
      padding: 2.5rem 2rem 2rem;
    }
    .logo-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 6rem;
      height: 6rem;
      border-radius: 9999px;
      background: #fff;
      box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06);
    }
    .logo-circle img {
      width: 84px;
      height: 84px;
      border-radius: 9999px;
      object-fit: contain;
    }
    .code {
      margin: 1.25rem 0 0;
      font-size: 4.5rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .eyebrow {
      color: #e0f2fe;
      font-size: 0.75rem;
      margin: 0.25rem 0 0;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .card-body {
      padding: 2rem;
    }
    .card-body h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1f2937;
    }
    .card-body p {
      margin: 0.5rem 0 0;
      font-size: 0.875rem;
      color: #6b7280;
      line-height: 1.5;
    }
    .btn {
      display: block;
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.625rem 1rem;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.875rem;
      border-radius: 0.375rem;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span class="logo-circle">
        <img src="/kdu_logo.png" alt="Koperativa Dezenvolvimentu Umanu">
      </span>
      <p class="code">404</p>
      <p class="eyebrow">KDU · Cooperative Core</p>
    </div>
    <div class="card-body">
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist, or you may not have access to it.</p>
      <a href="/" class="btn">Back to KDU</a>
    </div>
  </div>
</body>
</html>
