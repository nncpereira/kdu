<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  <style>
    @page {
      size: A4;
      margin: 2cm 1.5cm 2.5cm 1.5cm;
      @bottom-right {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 9pt;
        color: #666;
      }
      @bottom-left {
        content: "Generated {{ generated_at }}";
        font-size: 9pt;
        color: #666;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      font-size: 10pt;
      color: #111;
      line-height: 1.4;
    }

    .letterhead {
      display: flex;
      align-items: center;
      border-bottom: 2pt solid #0369a1;
      padding-bottom: 10pt;
      margin-bottom: 20pt;
    }
    .letterhead img {
      width: 60pt;
      height: 60pt;
      margin-right: 12pt;
    }
    .letterhead-text h1 {
      font-size: 16pt;
      margin: 0;
      color: #0369a1;
      letter-spacing: 0.5pt;
    }
    .letterhead-text .subtitle {
      font-size: 9pt;
      color: #666;
      margin-top: 2pt;
      text-transform: uppercase;
      letter-spacing: 1pt;
    }

    .report-title {
      font-size: 15pt;
      font-weight: bold;
      margin: 0 0 4pt 0;
      color: #111;
    }
    .report-period {
      font-size: 10pt;
      color: #555;
      margin-bottom: 20pt;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16pt;
    }
    thead th {
      text-align: left;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
      color: #555;
      border-bottom: 1pt solid #999;
      padding: 4pt 6pt;
      background: #f8fafc;
    }
    thead th.amount { text-align: right; }

    tbody td {
      padding: 4pt 6pt;
      border-bottom: 0.5pt solid #eee;
      font-size: 10pt;
    }
    tbody td.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .mono {
      font-family: "Menlo", "Courier New", monospace;
      font-size: 9pt;
      color: #555;
    }

    .total-row td {
      font-weight: bold;
      border-top: 1pt solid #333;
      border-bottom: none;
      padding-top: 6pt;
      padding-bottom: 6pt;
    }

    .section-title {
      font-size: 12pt;
      font-weight: bold;
      margin: 18pt 0 8pt 0;
      color: #0369a1;
      border-bottom: 0.5pt solid #cbd5e1;
      padding-bottom: 4pt;
    }

    .summary-grid {
      width: 100%;
      border-collapse: separate;
      border-spacing: 8pt 0;
      margin-bottom: 20pt;
    }
    .summary-box {
      border: 1pt solid #ddd;
      border-radius: 4pt;
      padding: 10pt;
      vertical-align: top;
      width: 25%;
    }
    .summary-box .label {
      font-size: 8.5pt;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
    }
    .summary-box .value {
      font-size: 14pt;
      font-weight: bold;
      margin-top: 4pt;
    }

    .footer-note {
      margin-top: 20pt;
      padding-top: 8pt;
      border-top: 0.5pt solid #ddd;
      font-size: 8pt;
      color: #888;
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 2pt 6pt;
      font-size: 8pt;
      border-radius: 3pt;
      text-transform: uppercase;
      letter-spacing: 0.5pt;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-gray { background: #e5e7eb; color: #374151; }
  </style>
</head>
<body>
  <div class="letterhead">
    <h1>Koperasi KDU</h1>
    <div class="subtitle">Cooperative Core Banking System</div>
  </div>

  <h2 class="report-title">{{ title }}</h2>
  <div class="report-period">{{ period }}</div>

  {% block content %}{% endblock %}

  <div class="footer-note">
    DL 16/2004 as amended by DL 76/2022 · Figures derived from the immutable general ledger
  </div>
</body>
</html>
