[pytest]
DJANGO_SETTINGS_MODULE = kdu.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --no-cov-on-fail
    -p no:warnings

markers =
    integration: full DB-level integration test
    smoke: quick sanity check
    slow: tests longer than 3 seconds
    pipeline: Maker-Checker-Certifier flow
    trigger: DB-level invariants
    shu: SHU calculation
    ledger: journal entry

testpaths = tests